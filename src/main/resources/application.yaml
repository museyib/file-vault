spring:
  application:
    name: file-vault
  datasource:
    url: jdbc:postgresql://localhost:5432/file_vault
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    generate-ddl: true
  servlet:
    multipart:
      max-file-size: 10MB

app:
  file:
    rootFolder: uploads
    allowedFileTypes: [".jpg", ".png", ".gif", ".jpeg", ".pdf"]
  jwt:
    issuer: ${APP_JWT_ISSUER:file-vault}
    secret: ${APP_JWT_SECRET:GuJ0HdJSDlMpjHVeKZ6ngZjkwUndcPm4nlOF1YWPLQk}
    access-token-expiration-minutes: ${APP_JWT_ACCESS_TTL_MINUTES:15}
    refresh-token-expiration-days: ${APP_JWT_REFRESH_TTL_DAYS:14}
  bootstrap-admin:
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
    display-name: ${APP_BOOTSTRAP_ADMIN_DISPLAY_NAME:Platform Admin}